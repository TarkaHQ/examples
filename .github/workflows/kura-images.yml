name: Kura images
on:
  workflow_dispatch:
  push:
    branches: [main, codex/kura]
    paths: ['kura/bot/**', 'kura/backend/**', 'kura/app/**', '.github/workflows/kura-images.yml']
permissions:
  contents: read
  packages: write
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: kura/bot
          push: true
          tags: ghcr.io/tarkahq/kura-bot:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/TarkaHQ/examples
          cache-from: type=gha,scope=kura-bot
          cache-to: type=gha,mode=max,scope=kura-bot
  api:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: kura
          file: kura/backend/Dockerfile
          push: true
          tags: ghcr.io/tarkahq/kura-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/TarkaHQ/examples
          cache-from: type=gha,scope=kura-api
          cache-to: type=gha,mode=max,scope=kura-api
