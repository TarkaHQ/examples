[project]
name = "kura-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2.8,<5.3", "djangorestframework>=3.16,<3.17", "psycopg[binary]>=3.2,<4", "dj-database-url>=3,<4", "gunicorn>=23,<24", "whitenoise>=6.9,<7", "boto3>=1.40,<2", "httpx>=0.28,<0.29"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.11,<5", "ruff>=0.13,<1"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
